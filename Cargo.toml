[workspace]
resolver = "2"
members = ["src-tauri", "crates/sync-core"]

# Profiles live at the workspace root (member profiles are ignored by cargo).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
