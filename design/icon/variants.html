<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#888;display:flex;gap:40px;padding:20px}</style></head>
<body>
<!-- A: card + month grid of squares -->
<svg id="a" width="512" height="512" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#17191d"/>
    </linearGradient>
    <linearGradient id="bandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f05c5c"/><stop offset="1" stop-color="#dd3d44"/>
    </linearGradient>
    <filter id="softA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#bgA)"/>
  <g filter="url(#softA)">
    <rect x="240" y="250" width="544" height="540" rx="56" fill="#f4f3f0"/>
    <path d="M240 306 a56 56 0 0 1 56 -56 h432 a56 56 0 0 1 56 56 v96 h-544 z" fill="url(#bandA)"/>
  </g>
  <rect x="356" y="196" width="36" height="120" rx="18" fill="#cfd4da"/>
  <rect x="632" y="196" width="36" height="120" rx="18" fill="#cfd4da"/>
  <g>
    <!-- 4x3 month grid; one red "today" -->
    <g fill="#d8d5cf">
      <rect x="312" y="462" width="92" height="76" rx="20"/><rect x="430" y="462" width="92" height="76" rx="20"/><rect x="548" y="462" width="92" height="76" rx="20"/><rect x="666" y="462" width="92" height="76" rx="20"/>
      <rect x="312" y="566" width="92" height="76" rx="20"/><rect x="430" y="566" width="92" height="76" rx="20"/><rect x="666" y="566" width="92" height="76" rx="20"/>
      <rect x="312" y="670" width="92" height="76" rx="20"/><rect x="430" y="670" width="92" height="76" rx="20"/><rect x="548" y="670" width="92" height="76" rx="20"/>
    </g>
    <rect x="548" y="566" width="92" height="76" rx="20" fill="#dd3d44"/>
    <rect x="666" y="670" width="92" height="76" rx="20" fill="#e6e4df"/>
  </g>
</svg>

<!-- B: flat dark squircle, red band full width, white grid -->
<svg id="b" width="512" height="512" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23262c"/><stop offset="1" stop-color="#141619"/>
    </linearGradient>
    <linearGradient id="bandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f05c5c"/><stop offset="1" stop-color="#dd3d44"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#bgB)"/>
  <path d="M64 268 a204 204 0 0 1 204 -204 h488 a204 204 0 0 1 204 204 v70 h-896 z" fill="url(#bandB)"/>
  <circle cx="320" cy="200" r="34" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="704" cy="200" r="34" fill="#ffffff" fill-opacity="0.9"/>
  <g fill="#e9e8e4" fill-opacity="0.92">
    <rect x="180" y="430" width="140" height="112" rx="28"/><rect x="356" y="430" width="140" height="112" rx="28"/><rect x="532" y="430" width="140" height="112" rx="28"/><rect x="708" y="430" width="140" height="112" rx="28"/>
    <rect x="180" y="586" width="140" height="112" rx="28"/><rect x="356" y="586" width="140" height="112" rx="28"/><rect x="708" y="586" width="140" height="112" rx="28"/>
    <rect x="180" y="742" width="140" height="112" rx="28"/><rect x="356" y="742" width="140" height="112" rx="28"/>
  </g>
  <rect x="532" y="586" width="140" height="112" rx="28" fill="#dd3d44"/>
</svg>

<!-- C: light card fills squircle, red left time-bar like event chips -->
<svg id="c" width="512" height="512" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#17191d"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#bgC)"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="5">
    <line x1="140" y1="340" x2="884" y2="340"/><line x1="140" y1="500" x2="884" y2="500"/><line x1="140" y1="660" x2="884" y2="660"/>
  </g>
  <!-- event chips -->
  <g>
    <rect x="200" y="230" width="380" height="180" rx="36" fill="#4f8cff" fill-opacity="0.32"/>
    <rect x="200" y="230" width="18" height="180" rx="9" fill="#4f8cff"/>
    <rect x="620" y="300" width="204" height="260" rx="36" fill="#2fbf71" fill-opacity="0.32"/>
    <rect x="620" y="300" width="18" height="260" rx="9" fill="#2fbf71"/>
    <rect x="260" y="470" width="320" height="150" rx="36" fill="#e8a13c" fill-opacity="0.32"/>
    <rect x="260" y="470" width="18" height="150" rx="9" fill="#e8a13c"/>
  </g>
  <!-- now line -->
  <line x1="120" y1="688" x2="904" y2="688" stroke="#dd3d44" stroke-width="14" stroke-linecap="round"/>
  <circle cx="140" cy="688" r="26" fill="#dd3d44"/>
</svg>
</body></html>
