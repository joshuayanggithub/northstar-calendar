[package]
name = "calendar-app"
version = "0.1.0"
description = "Local-first calendar with two-way Google Calendar sync"
authors = ["Joshua Yang"]
edition = "2021"

[lib]
name = "calendar_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sync-core = { path = "../crates/sync-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ureq = { version = "2.10", features = ["json"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = { version = "3", features = ["apple-native"] }
iana-time-zone = "0.1"
# W3C WebDriver endpoint inside the app (127.0.0.1:4445). Cargo does not
# support debug_assertions in target dependency tables; initialization is
# still compiled behind #[cfg(debug_assertions)] in src/lib.rs.
tauri-plugin-webdriver = "0.2.3"
